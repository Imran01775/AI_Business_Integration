[project]
name = "sales-agent-backend"
version = "0.0.0"
description = "AI Sales Agent Platform — modular monolith API and workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ai-platform",
    "alembic>=1.14",
    "jinja2>=3.1",
    "minio>=7.2",
    "prometheus-client>=0.21",
    "sentry-sdk>=2.19",
    "uuid6>=2024.7",
    "argon2-cffi>=23.1",
    "arq>=0.26",
    "asyncpg>=0.30",
    "cryptography>=44.0",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "opentelemetry-api>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-sdk>=1.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "import-linter>=2.1",
    "mypy>=1.14",
    "pip-audit>=2.7",
    "polyfactory>=2.18",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "testcontainers>=4.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
ai-platform = { path = "../ai-platform", editable = true }

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/app/core/auth/dependencies.py" = ["B008"]
"src/app/modules/**/api/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ai_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["app"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring external services (PostgreSQL, Redis)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
