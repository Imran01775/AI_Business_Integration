# Dev dependencies only.
# PostgreSQL runs on the Windows host.
# Run from repository root:
# docker compose -f docker/compose.deps.yaml up -d

name: sales-agent-deps

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Persistent local file storage
  file-storage:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data && tail -f /dev/null"]
    volumes:
      - app-files:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  app-files:












